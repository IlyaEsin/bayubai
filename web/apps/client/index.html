<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4551" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221a18" media="(prefers-color-scheme: dark)" />
    <title>Баюбай</title>
    <script>
      // Applies the saved or system theme before the first paint, so a dark-theme night visit never flashes white.
      try {
        var saved = localStorage.getItem('bb.theme');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
