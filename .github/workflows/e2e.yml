name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      # The Aspire CLI starts the AppHost with its https launch profile; on Linux, OpenSSL trusts the dev certificate only through SSL_CERT_DIR.
      - name: Trust the ASP.NET Core development certificate
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
          dotnet dev-certs https --trust

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies and Chromium
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (Playwright starts the Aspire AppHost)
        working-directory: tests/e2e
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
