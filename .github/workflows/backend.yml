name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bayubai.slnx

      - name: Build
        run: dotnet build Bayubai.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Bayubai.slnx --no-build --configuration Release

      # infra/ is the reviewable output of the AppHost's Azure model; it must be regenerated and committed with every model change.
      - name: Committed infra matches the Azure model
        run: |
          dotnet tool restore
          dotnet aspire publish --apphost src/Bayubai.AppHost/Bayubai.AppHost.csproj --output-path infra --non-interactive --nologo
          git diff --exit-code -- infra
          test -z "$(git status --porcelain -- infra)"
