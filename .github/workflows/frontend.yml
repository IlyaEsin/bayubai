name: frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (includes i18n key parity and error-code coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

      # The build step regenerates the route trees via the TanStack Router plugin; they must not drift from what is committed.
      - name: Generated route trees match what is committed
        run: git diff --exit-code -- apps/client/src/routeTree.gen.ts apps/studio/src/routeTree.gen.ts

      # The backend job pins openapi.json to the served document; this pins the generated client to openapi.json.
      - name: Generated API client matches the OpenAPI snapshot
        run: |
          pnpm generate:api
          git diff --exit-code -- packages/api-client/src/generated
          test -z "$(git status --porcelain -- packages/api-client/src/generated)"
