name: hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Free for repositories of personal accounts; organisations would need GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  forbidden-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: No forbidden third-party names in files or history
        env:
          FORBIDDEN_REFERENCES: ${{ secrets.FORBIDDEN_REFERENCES }}
        run: bash .github/scripts/forbidden-references.sh

  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The deploy scripts run with Azure credentials, and shellcheck is preinstalled on the runner.
      - name: shellcheck
        run: shellcheck deploy/*.sh .github/scripts/*.sh
