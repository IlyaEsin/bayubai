version: 2
updates:
  # Dependabot does not read .slnx, so every project directory is listed; "/" adds .config/dotnet-tools.json so the Aspire CLI moves with the Aspire packages.
  - package-ecosystem: nuget
    directories: ["/", "/src/*", "/src/Modules/*", "/tests/*"]
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/web", "/tests/e2e"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
